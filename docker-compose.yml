services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - shelfflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      BASE_PATH: ${BASE_PATH:-/projects/shelfflow}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: "true"
      LOAN_PERIOD_DAYS: ${LOAN_PERIOD_DAYS:-14}
      UPLOAD_DIR: /app/storage/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2097152}
      OPEN_LIBRARY_BASE_URL: https://openlibrary.org
      OPEN_LIBRARY_USER_AGENT: ${OPEN_LIBRARY_USER_AGENT}
    volumes:
      - shelfflow_uploads:/app/storage/uploads
    ports:
      - "127.0.0.1:8098:3000"

volumes:
  shelfflow_pgdata:
    name: shelfflow_pgdata
  shelfflow_uploads:
    name: shelfflow_uploads
